<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
  <title>ETU MAP</title>

  <style>
    :root {
      --bg: #fff;
      --text: #111;
      --muted: #666;
      --line: #e8e8e8;
      --active-bg: #f3f3f3;
      --nav-width: 260px;
      --source-height: 34px;
      --safe-bottom: env(safe-area-inset-bottom, 0px);
      --safe-left: env(safe-area-inset-left, 0px);
      --safe-right: env(safe-area-inset-right, 0px);
      --source-h: calc(var(--source-height) + var(--safe-bottom));
    }

    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
      overflow: hidden;
      overscroll-behavior: none;
      -webkit-tap-highlight-color: transparent;
    }

    .sr-only {
      position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
      overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0;
    }

    .app {
      position: fixed; inset: 0;
      display: grid; grid-template-rows: 1fr auto;
      height: 100vh; height: 100dvh;
    }

    .stage { min-height: 0; display: grid; grid-template-columns: 1fr; }
    @media (min-width: 900px) { .stage { grid-template-columns: 1fr var(--nav-width); } }

    .viewer {
      position: relative; min-width: 0; min-height: 0;
      overflow: hidden; background: #fff;
    }

    /* Контейнер листания этажей. pan-x = свайп листает, pinch НЕ зумит страницу. */
    .slides {
      width: 100%; height: 100%;
      display: flex;
      overflow-x: auto; overflow-y: hidden;
      scroll-snap-type: x mandatory;
      scroll-behavior: smooth;
      scrollbar-width: none; -ms-overflow-style: none;
      touch-action: pan-x;
      overscroll-behavior-x: contain;
    }
    .slides::-webkit-scrollbar { display: none; }

    .slide {
      flex: 0 0 100%; width: 100%; height: 100%;
      scroll-snap-align: start; scroll-snap-stop: always;
      display: flex; align-items: center; justify-content: center; /* центр зоны */
      background: #fff; overflow: hidden;
    }

    .slide img {
      display: block;
      width: auto; height: auto;
      max-width: 100%; max-height: 100%;   /* contain без object-fit → центр совпадает с зоной */
      transform-origin: center center;      /* зум/пан вешаем через JS на transform */
      touch-action: pan-x;                  /* JS переключит на none, когда карта приближена */
      cursor: grab;
      user-select: none; -webkit-user-drag: none;
      will-change: transform;
    }
    .slide img.panning { cursor: grabbing; }

    .slide .fallback {
      padding: 24px; text-align: center; color: var(--muted); font-size: 14px;
    }

    /* Стрелки листания по бокам */
    .arrow {
      position: absolute; top: 50%; z-index: 15;
      width: 54px; height: 54px; border-radius: 50%;
      display: grid; place-items: center;
      border: 1px solid rgba(255,255,255,.20);
      background: rgba(0,0,0,.34); color: #fff;
      box-shadow: 0 4px 18px rgba(0,0,0,.14);
      backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
      cursor: pointer; touch-action: manipulation;
      transform: translateY(-50%);
    }
    .arrow.left  { left:  calc(10px + var(--safe-left)); }
    .arrow.right { right: calc(10px + var(--safe-right)); }
    .arrow:active { background: rgba(0,0,0,.48); }
    .arrow:disabled { opacity: .24; cursor: default; }
    .arrow svg { width: 28px; height: 28px; display: block; }

    /* Кнопки зума: колонка сверху справа, чтобы не мешать стрелкам и hint */
    .zoom-bar {
      position: absolute; z-index: 16;
      top: calc(12px + env(safe-area-inset-top, 0px));
      right: calc(12px + var(--safe-right));
      display: flex; flex-direction: column; gap: 8px;
    }
    .zoom-btn {
      width: 44px; height: 44px; border-radius: 12px;
      display: grid; place-items: center;
      border: 1px solid rgba(255,255,255,.20);
      background: rgba(0,0,0,.34); color: #fff;
      box-shadow: 0 4px 14px rgba(0,0,0,.14);
      backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
      cursor: pointer; touch-action: manipulation;
      font-size: 22px; line-height: 1; font-weight: 600;
    }
    .zoom-btn:active { background: rgba(0,0,0,.5); }
    .zoom-btn svg { width: 22px; height: 22px; display: block; }

    /* Постоянный hint */
    .hint {
      position: absolute; left: 50%; bottom: 14px; transform: translateX(-50%);
      z-index: 14; max-width: calc(100% - 150px);
      padding: 8px 14px; border-radius: 999px;
      background: rgba(0,0,0,.48); color: #fff;
      font-size: 12px; line-height: 1.25; text-align: center;
      pointer-events: none;
      backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px);
    }

    .nav {
      position: fixed; top: 0; right: 0; bottom: var(--source-h);
      width: min(86vw, var(--nav-width)); z-index: 30;
      background: #fff; border-left: 1px solid var(--line);
      padding: 16px 14px; overflow-y: auto; overscroll-behavior: contain;
      transform: translateX(100%); transition: transform .25s ease;
    }
    .nav.open { transform: translateX(0); }
    @media (min-width: 900px) {
      .nav, .nav.open {
        position: relative; top: auto; right: auto; bottom: auto;
        width: auto; transform: none; transition: none;
      }
    }
    .nav-title { margin: 0 0 12px; font-size: 15px; font-weight: 650; }
    .nav-list { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
    .nav-btn {
      width: 100%; min-height: 48px; padding: 10px 12px;
      border: 1px solid var(--line); border-radius: 12px;
      background: #fff; color: var(--text); font: inherit; font-size: 15px;
      text-align: left; cursor: pointer;
    }
    .nav-btn:hover { background: #fafafa; }
    .nav-btn[aria-current="true"] { background: var(--active-bg); border-color: #cfcfcf; font-weight: 650; }

    .nav-toggle {
      position: fixed; right: calc(12px + var(--safe-right));
      bottom: calc(var(--source-h) + 12px); top: auto; transform: none;
      z-index: 35; width: 54px; height: 54px; border-radius: 50%; padding: 0;
      display: grid; place-items: center;
      border: 1px solid rgba(255,255,255,.20);
      background: rgba(0,0,0,.42); color: #fff;
      box-shadow: 0 4px 18px rgba(0,0,0,.16);
      backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
      cursor: pointer;
    }
    .nav-toggle svg { width: 24px; height: 24px; display: block; }
    @media (min-width: 900px) { .nav-toggle { display: none; } }

    .backdrop {
      position: fixed; inset: 0; z-index: 20;
      background: rgba(0,0,0,.16); opacity: 0; pointer-events: none;
      transition: opacity .2s ease;
    }
    .backdrop.show { opacity: 1; pointer-events: auto; }
    @media (min-width: 900px) { .backdrop { display: none; } }

    .source {
      position: relative; z-index: 40; min-height: var(--source-h);
      display: grid; place-items: center;
      padding: 6px 12px calc(6px + var(--safe-bottom));
      background: #fff; color: var(--muted); font-size: 12px; line-height: 1.2; text-align: center;
    }
  </style>
</head>

<body>
  <div class="app">
    <div class="stage">
      <section class="viewer" aria-label="Map view">
        <div id="slides" class="slides" role="region"
             aria-label="Maps: swipe - move; mousewheel - zoom" tabindex="0"></div>

        <button id="prevArrow" class="arrow left" type="button" aria-label="Previous image">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg>
        </button>
        <button id="nextArrow" class="arrow right" type="button" aria-label="Next image">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 18l6-6-6-6"/></svg>
        </button>

        <div class="zoom-bar">
          <button id="zoomIn"  class="zoom-btn" type="button" aria-label="Zoom in">+</button>
          <button id="zoomOut" class="zoom-btn" type="button" aria-label="Zoom out">&minus;</button>
          <button id="zoomReset" class="zoom-btn" type="button" aria-label="Reset">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4v4h4"/></svg>
          </button>
        </div>

        <div id="hint" class="hint">Swipe/arrow</div>
      </section>

      <button id="navToggle" class="nav-toggle" type="button" aria-controls="nav" aria-expanded="false" aria-label="Buildings">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 6h16"/><path d="M4 12h16"/><path d="M4 18h16"/></svg>
        <span class="sr-only">Buildings</span>
      </button>

      <div id="backdrop" class="backdrop"></div>

      <aside id="nav" class="nav" aria-label="Buildings sections">
        <h2 class="nav-title">Buildings</h2>
        <ul id="navList" class="nav-list"></ul>
      </aside>
    </div>

	<style>
	  .source {
		display: inline; 
		white-space: normal; 
	  }
	  .source a {
		display: inline; 
		margin: 0; 
	  }
	</style>
	
    <footer class="source">Source: <a href="https://vk.com/studkuratorstvo?w=wall-40766195_8333">vk.com</a></footer>
  </div>

  <script>
    const BUILDINGS = [
      { id: "main", label: "Main map", images: ["images/main map.jpg"] },
      { id: "1", label: "Building 1", images: ["images/1-1.jpg","images/1-2.jpg","images/1-3.jpg","images/1-4.jpg","images/1-5.jpg"] },
      { id: "2", label: "Building 2", images: ["images/2-1.jpg","images/2-2.jpg","images/2-3.jpg","images/2-4.jpg"] },
      { id: "3", label: "Building 3", images: ["images/3-1.jpg","images/3-2.jpg","images/3-3.jpg"] },
      { id: "4", label: "Building 4", images: ["images/4-1.jpg","images/4-2.jpg","images/4-3.jpg"] },
      { id: "5", label: "Building 5", images: ["images/5-1.jpg","images/5-2.jpg","images/5-3.jpg"] },
      { id: "6", label: "Building 6", images: ["images/6-map.jpg","images/6-1.jpg","images/6-2.jpg","images/6-3.jpg"] }
    ];

    const MIN_SCALE   = 1;     
    const MAX_SCALE   = 6;     
    const START_SCALE = 1;     
    const DBL_SCALE   = 2.5;   
    const WHEEL_K     = 0.0016;

    const slidesEl  = document.getElementById("slides");
    const navEl     = document.getElementById("nav");
    const navListEl = document.getElementById("navList");
    const navToggle = document.getElementById("navToggle");
    const backdrop  = document.getElementById("backdrop");
    const prevArrow = document.getElementById("prevArrow");
    const nextArrow = document.getElementById("nextArrow");

    let currentId = null;
    const toUrl = p => encodeURI(p);

    function getZ(slide) {
      if (!slide._z) slide._z = { scale: START_SCALE, tx: 0, ty: 0 };
      return slide._z;
    }
    function imgOf(slide) { return slide.querySelector("img"); }

    function clampZ(slide) {
      const z = getZ(slide), img = imgOf(slide);
      if (!img) return z;
      const cw = slide.clientWidth, ch = slide.clientHeight;
      const ow = img.offsetWidth,  oh = img.offsetHeight; // layout-размер БЕЗ transform
      const maxTx = Math.max(0, (ow * z.scale - cw) / 2);
      const maxTy = Math.max(0, (oh * z.scale - ch) / 2);
      z.tx = Math.min(maxTx, Math.max(-maxTx, z.tx));
      z.ty = Math.min(maxTy, Math.max(-maxTy, z.ty));
      return z;
    }

    function applyZ(slide, animate) {
      const z = clampZ(slide), img = imgOf(slide);
      if (!img) return;
      img.style.transition = animate ? "transform .25s ease" : "none";
      img.style.transform  = `translate(${z.tx}px, ${z.ty}px) scale(${z.scale})`;
      img.style.touchAction = z.scale > 1.001 ? "none" : "pan-x";
      if (animate) setTimeout(() => { img.style.transition = "none"; }, 260);
    }

    function zoomAt(slide, cx, cy, newScale, animate) {
      const z = getZ(slide);
      newScale = Math.min(MAX_SCALE, Math.max(MIN_SCALE, newScale));
      const cw = slide.clientWidth, ch = slide.clientHeight;
      const celx = cw / 2, cely = ch / 2;
      const ratio = newScale / z.scale;
      z.tx = (cx - celx) - (cx - celx - z.tx) * ratio;
      z.ty = (cy - cely) - (cy - cely - z.ty) * ratio;
      z.scale = newScale;
      applyZ(slide, animate);
    }

    function activeSlide() {
      const w = slidesEl.clientWidth || 1;
      const i = Math.round(slidesEl.scrollLeft / w);
      return slidesEl.children[i] || null;
    }
    // координата курсора/пальца относительно слайда
    function local(slide, clientX, clientY) {
      const r = slide.getBoundingClientRect();
      return { x: clientX - r.left, y: clientY - r.top };
    }

    /* ====== ЖЕСТЫ (pointer events на viewer) ====== */
    const viewer = document.querySelector(".viewer");
    const pointers = new Map();      // pointerId -> {x,y}
    let pinch = null;                // {dist, cx, cy}
    let pan   = null;                // {x,y}
    let tapInfo = { time: 0, x: 0, y: 0 };

    const isUI = t => t.closest(".arrow, .zoom-btn, .hint, .nav, .nav-toggle");

    viewer.addEventListener("pointerdown", e => {
      if (isUI(e.target)) return;
      pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });

      if (pointers.size === 2) {
        const [a, b] = [...pointers.values()];
        const slide = activeSlide(); if (!slide) return;
        const ca = local(slide, a.x, a.y), cb = local(slide, b.x, b.y);
        pinch = {
          dist: Math.hypot(a.x - b.x, a.y - b.y) || 1,
          cx: (ca.x + cb.x) / 2, cy: (ca.y + cb.y) / 2
        };
        pan = null;
        e.preventDefault();
      } else if (pointers.size === 1) {
        const slide = activeSlide();
        if (slide && getZ(slide).scale > 1.001) {   // панорама только когда приближено
          pan = { x: e.clientX, y: e.clientY };
          imgOf(slide)?.classList.add("panning");
          e.preventDefault();
        }
        tapInfo.moved = 0; tapInfo.t = performance.now();
        tapInfo.x = e.clientX; tapInfo.y = e.clientY;
      }
    });

    viewer.addEventListener("pointermove", e => {
      if (!pointers.has(e.pointerId)) return;
      pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });

      if (pointers.size >= 2 && pinch) {
        const slide = activeSlide(); if (!slide) return;
        const [a, b] = [...pointers.values()];
        const dist = Math.hypot(a.x - b.x, a.y - b.y) || 1;
        const ca = local(slide, a.x, a.y), cb = local(slide, b.x, b.y);
        const ncx = (ca.x + cb.x) / 2, ncy = (ca.y + cb.y) / 2;
        const z = getZ(slide);
        // 1) донести центр пальцев  2) зум к новому центру
        z.tx += ncx - pinch.cx; z.ty += ncy - pinch.cy;
        const newScale = Math.min(MAX_SCALE, Math.max(MIN_SCALE, z.scale * (dist / pinch.dist)));
        zoomAt(slide, ncx, ncy, newScale, false);
        pinch.dist = dist; pinch.cx = ncx; pinch.cy = ncy;
        e.preventDefault();
      } else if (pan && pointers.size === 1) {
        const slide = activeSlide(); if (!slide) return;
        const z = getZ(slide);
        z.tx += e.clientX - pan.x; z.ty += e.clientY - pan.y;
        pan.x = e.clientX; pan.y = e.clientY;
        tapInfo.moved += 1;
        applyZ(slide, false);
        e.preventDefault();
      } else if (pointers.size === 1) {
        tapInfo.moved += Math.abs(e.clientX - tapInfo.x) + Math.abs(e.clientY - tapInfo.y);
      }
    });

    function endPointer(e) {
      if (isUI(e.target)) { pointers.delete(e.pointerId); return; }
      const wasPan = pan;
      pointers.delete(e.pointerId);

      if (pointers.size < 2) pinch = null;
      if (pointers.size === 0) {
        if (wasPan) { const s = activeSlide(); imgOf(s)?.classList.remove("panning"); pan = null; }
        // двойной тап / клик
        const dt = performance.now() - (tapInfo.t || 0);
        const near = Math.hypot(e.clientX - tapInfo.x, e.clientY - tapInfo.y) < 30;
        if ((tapInfo.moved || 0) < 8 && dt < 300 && near) {
          const slide = activeSlide();
          if (slide) {
            const z = getZ(slide);
            const p = local(slide, e.clientX, e.clientY);
            const target = z.scale > 1.05 ? MIN_SCALE : DBL_SCALE;
            if (target === MIN_SCALE) { z.tx = 0; z.ty = 0; z.scale = MIN_SCALE; applyZ(slide, true); }
            else zoomAt(slide, p.x, p.y, target, true);
          }
          tapInfo.t = 0;
        } else {
          tapInfo.t = performance.now(); tapInfo.x = e.clientX; tapInfo.y = e.clientY; tapInfo.moved = 0;
        }
      }
    }
    viewer.addEventListener("pointerup", endPointer);
    viewer.addEventListener("pointercancel", endPointer);

    // колесо мыши = зум к курсору
    viewer.addEventListener("wheel", e => {
      if (isUI(e.target)) return;
      const slide = activeSlide(); if (!slide) return;
      e.preventDefault();
      const z = getZ(slide);
      const factor = Math.pow(2, -e.deltaY * WHEEL_K);
      const p = local(slide, e.clientX, e.clientY);
      zoomAt(slide, p.x, p.y, z.scale * factor, false);
    }, { passive: false });

    // кнопки зума к центру
    const zoomCenter = (mult) => {
      const slide = activeSlide(); if (!slide) return;
      const z = getZ(slide);
      zoomAt(slide, slide.clientWidth / 2, slide.clientHeight / 2, z.scale * mult, true);
    };
    document.getElementById("zoomIn").addEventListener("click", () => zoomCenter(1.6));
    document.getElementById("zoomOut").addEventListener("click", () => zoomCenter(1 / 1.6));
    document.getElementById("zoomReset").addEventListener("click", () => {
      const slide = activeSlide(); if (!slide) return;
      const z = getZ(slide); z.scale = START_SCALE; z.tx = 0; z.ty = 0; applyZ(slide, true);
    });

    /* ====== ЛИСТАНИЕ ЭТАЖЕЙ ====== */
    function updateControls() {
      const count = slidesEl.children.length;
      const canScroll = count > 1;
      const w = slidesEl.clientWidth || 1;
      const i = Math.round(slidesEl.scrollLeft / w);
      prevArrow.disabled = !canScroll || i <= 0;
      nextArrow.disabled = !canScroll || i >= count - 1;
    }
    function slideBy(dir) {
      const w = slidesEl.clientWidth; if (!w) return;
      slidesEl.scrollBy({ left: dir * w, behavior: "smooth" });
      setTimeout(updateControls, 90);
    }
    prevArrow.addEventListener("click", () => slideBy(-1));
    nextArrow.addEventListener("click", () => slideBy(1));
    slidesEl.addEventListener("scroll", updateControls, { passive: true });
    window.addEventListener("resize", () => {
      const s = activeSlide(); if (s) applyZ(s, false); updateControls();
    });
    slidesEl.addEventListener("keydown", e => {
      if (e.key === "ArrowRight") { e.preventDefault(); slideBy(1); }
      if (e.key === "ArrowLeft")  { e.preventDefault(); slideBy(-1); }
    });

    /* ====== МЕНЮ КОРПУСОВ ====== */
    function renderNav() {
      navListEl.innerHTML = "";
      BUILDINGS.forEach(b => {
        const li = document.createElement("li");
        const btn = document.createElement("button");
        btn.type = "button"; btn.className = "nav-btn"; btn.textContent = b.label;
        btn.dataset.id = b.id; btn.setAttribute("aria-current", String(b.id === currentId));
        btn.addEventListener("click", () => { openBuilding(b.id); closeNav(); });
        li.appendChild(btn); navListEl.appendChild(li);
      });
    }
    function setActiveNav() {
      document.querySelectorAll(".nav-btn").forEach(btn =>
        btn.setAttribute("aria-current", String(btn.dataset.id === currentId)));
    }
    const openNav  = () => { navEl.classList.add("open"); backdrop.classList.add("show"); navToggle.setAttribute("aria-expanded","true"); };
    const closeNav = () => { navEl.classList.remove("open"); backdrop.classList.remove("show"); navToggle.setAttribute("aria-expanded","false"); };
    navToggle.addEventListener("click", () => navEl.classList.contains("open") ? closeNav() : openNav());
    backdrop.addEventListener("click", closeNav);
    document.addEventListener("keydown", e => { if (e.key === "Escape") closeNav(); });

    function openBuilding(id) {
      const b = BUILDINGS.find(x => x.id === id) || BUILDINGS[0];
      currentId = b.id;
      pointers.clear(); pinch = null; pan = null;
      slidesEl.innerHTML = "";

      b.images.forEach((src, index) => {
        const slide = document.createElement("div");
        slide.className = "slide";
        slide._z = { scale: START_SCALE, tx: 0, ty: 0 };

        const img = document.createElement("img");
        img.alt = `${b.label}: image ${index + 1}`;
        img.loading = index <= 1 ? "eager" : "lazy";
        img.decoding = "async"; img.draggable = false;
        img.src = toUrl(src);
        img.addEventListener("error", () => {
          slide.innerHTML = `<div class="fallback">Error: ${src}</div>`;
        });

        slide.appendChild(img);
        slidesEl.appendChild(slide);
        // применяем стартовый вид после layout
        requestAnimationFrame(() => applyZ(slide, false));
      });

      slidesEl.scrollLeft = 0;
      setActiveNav();
      updateControls();
      try { history.replaceState(null, "", `#${b.id}`); } catch (_) {}
    }

    renderNav();
    const initHash = decodeURIComponent(location.hash.replace("#", ""));
    openBuilding(BUILDINGS.some(x => x.id === initHash) ? initHash : "main");
    window.addEventListener("hashchange", () => {
      const id = decodeURIComponent(location.hash.replace("#", ""));
      if (BUILDINGS.some(x => x.id === id) && id !== currentId) openBuilding(id);
    });
  </script>
</body>
</html>
