<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>ETU MAP</title>

  <style>
    :root {
      --bg: #fff;
      --text: #111;
      --muted: #666;
      --line: #e8e8e8;
      --active-bg: #f3f3f3;

      --nav-width: 260px;

      --source-height: 20px;
      --safe-bottom: env(safe-area-inset-bottom, 0px);
      --safe-left: env(safe-area-inset-left, 0px);
      --safe-right: env(safe-area-inset-right, 0px);
      --source-h: calc(var(--source-height) + var(--safe-bottom));

      --map-scale: 1;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      height: 100%;
      margin: 0;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
      overflow: hidden;
      overscroll-behavior: none;
      -webkit-tap-highlight-color: transparent;
    }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    .app {
      position: fixed;
      inset: 0;
      display: grid;
      grid-template-rows: 1fr auto;
      height: 100vh;
      height: 100dvh;
    }

    .stage {
      min-height: 0;
      display: grid;
      grid-template-columns: 1fr;
    }

    @media (min-width: 900px) {
      .stage {
        grid-template-columns: 1fr var(--nav-width);
      }
    }

    .viewer {
      position: relative;
      min-width: 0;
      min-height: 0;
      overflow: hidden;
      background: #fff;
    }

    .slides {
      width: 100%;
      height: 100%;
      display: flex;
      overflow-x: auto;
      overflow-y: hidden;
      scroll-snap-type: x mandatory;
      scroll-behavior: smooth;
      scrollbar-width: none;
      -ms-overflow-style: none;
      touch-action: pan-x;
      overscroll-behavior-x: contain;
      cursor: grab;
    }

    .slides::-webkit-scrollbar {
      display: none;
    }

    .slides.dragging {
      cursor: grabbing;
      scroll-behavior: auto;
      scroll-snap-type: none;
    }

	.slide {
	  flex: 0 0 100%;
	  width: 100%;
	  height: 100%;
	  scroll-snap-align: start;
	  scroll-snap-stop: always;

	  /* центрируем картинку как обычный элемент, а не через object-fit */
	  display: flex;
	  align-items: center;
	  justify-content: center;

	  background: #fff;
	  overflow: hidden;
	}

	.slide img {
	  display: block;

	  /* естественный размер, но не больше зоны (аналог contain) */
	  width: auto;
	  height: auto;
	  max-width: 100%;
	  max-height: 100%;

	  /* масштабируем вокруг центра самой картинки = центра зоны */
	  transform: scale(var(--map-scale));
	  transform-origin: center center;

	  user-select: none;
	  -webkit-user-drag: none;
	  pointer-events: none;
	}

    .slide .fallback {
      padding: 24px;
      text-align: center;
      color: var(--muted);
      font-size: 14px;
      pointer-events: auto;
    }

    /* Стрелки поверх карты */
    .arrow {
      position: absolute;
      top: 50%;
      z-index: 15;

      width: 54px;
      height: 54px;
      border-radius: 50%;

      display: grid;
      place-items: center;

      border: 1px solid rgba(255, 255, 255, 0.20);
      background: rgba(0, 0, 0, 0.34);
      color: #fff;

      box-shadow: 0 4px 18px rgba(0, 0, 0, 0.14);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);

      cursor: pointer;
      touch-action: manipulation;

      transform: translateY(-50%);
    }

    .arrow.left {
      left: calc(10px + var(--safe-left));
    }

    .arrow.right {
      right: calc(10px + var(--safe-right));
    }

    .arrow:active {
      background: rgba(0, 0, 0, 0.48);
    }

    .arrow:disabled {
      opacity: 0.24;
      cursor: default;
    }

    .arrow svg {
      width: 28px;
      height: 28px;
      display: block;
    }

    /* Постоянный hint */
    .hint {
      position: absolute;
      left: 50%;
      bottom: 14px;
      transform: translateX(-50%);
      z-index: 14;

      max-width: calc(100% - 140px);
      padding: 8px 14px;
      border-radius: 999px;

      background: rgba(0, 0, 0, 0.48);
      color: #fff;

      font-size: 12px;
      line-height: 1.2;
      text-align: center;

      opacity: 1;
      pointer-events: none;

      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);
    }

    .nav {
      position: fixed;
      top: 0;
      right: 0;
      bottom: var(--source-h);
      width: min(86vw, var(--nav-width));
      z-index: 30;

      background: #fff;
      border-left: 1px solid var(--line);
      padding: 16px 14px;
      overflow-y: auto;
      overscroll-behavior: contain;

      transform: translateX(100%);
      transition: transform .25s ease;
    }

    .nav.open {
      transform: translateX(0);
    }

    @media (min-width: 900px) {
      .nav,
      .nav.open {
        position: relative;
        top: auto;
        right: auto;
        bottom: auto;
        width: auto;
        transform: none;
        transition: none;
      }
    }

    .nav-title {
      margin: 0 0 12px;
      font-size: 15px;
      font-weight: 650;
      color: var(--text);
    }

    .nav-list {
      list-style: none;
      margin: 0;
      padding: 0;
      display: grid;
      gap: 8px;
    }

    .nav-btn {
      width: 100%;
      min-height: 48px;
      padding: 10px 12px;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: #fff;
      color: var(--text);
      font: inherit;
      font-size: 15px;
      text-align: left;
      cursor: pointer;
    }

    .nav-btn:hover {
      background: #fafafa;
    }

    .nav-btn[aria-current="true"] {
      background: var(--active-bg);
      border-color: #cfcfcf;
      font-weight: 650;
    }

    /* Кнопка открытия Buildingов на телефоне */
    .nav-toggle {
      position: fixed;
      right: calc(12px + var(--safe-right));
      bottom: calc(var(--source-h) + 12px);
      top: auto;
      transform: none;

      z-index: 35;

      width: 54px;
      height: 54px;
      border-radius: 50%;
      padding: 0;

      display: grid;
      place-items: center;

      border: 1px solid rgba(255, 255, 255, 0.20);
      background: rgba(0, 0, 0, 0.42);
      color: #fff;

      box-shadow: 0 4px 18px rgba(0, 0, 0, 0.16);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);

      cursor: pointer;
    }

    .nav-toggle svg {
      width: 24px;
      height: 24px;
      display: block;
    }

    @media (min-width: 900px) {
      .nav-toggle {
        display: none;
      }
    }

    .backdrop {
      position: fixed;
      inset: 0;
      z-index: 20;
      background: rgba(0, 0, 0, 0.16);
      opacity: 0;
      pointer-events: none;
      transition: opacity .2s ease;
    }

    .backdrop.show {
      opacity: 1;
      pointer-events: auto;
    }

    @media (min-width: 900px) {
      .backdrop {
        display: none;
      }
    }

    .source {
      position: relative;
      z-index: 40;
      min-height: var(--source-h);
      display: grid;
      place-items: center;
      padding: 6px 12px calc(6px + var(--safe-bottom));
      background: #fff;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.2;
      text-align: center;
    }
  </style>
</head>

<body>
  <div class="app">
    <div class="stage">
      <section class="viewer" aria-label="Map view">
        <div
          id="slides"
          class="slides"
          role="region"
          aria-label="Maps, swipe horizontally"
          tabindex="0"
        ></div>

        <button
          id="prevArrow"
          class="arrow left"
          type="button"
          aria-label="Previous image"
        >
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M15 18l-6-6 6-6" />
          </svg>
        </button>

        <button
          id="nextArrow"
          class="arrow right"
          type="button"
          aria-label="Next image"
        >
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M9 18l6-6-6-6" />
          </svg>
        </button>

        <div id="hint" class="hint">Swipe right</div>
      </section>

      <button
        id="navToggle"
        class="nav-toggle"
        type="button"
        aria-controls="nav"
        aria-expanded="false"
        aria-label="Buildings"
      >
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M4 6h16" />
          <path d="M4 12h16" />
          <path d="M4 18h16" />
        </svg>
        <span class="sr-only">Buildings</span>
      </button>

      <div id="backdrop" class="backdrop"></div>

      <aside id="nav" class="nav" aria-label="Buildings section">
        <h2 class="nav-title">Buildings</h2>
        <ul id="navList" class="nav-list"></ul>
      </aside>
    </div>
	
	<style>
	  .source {
		display: inline; /* или block, но тогда убедитесь, что внутренние элементы тоже inline */
		white-space: normal; /* игнорирует переносы строк в HTML */
	  }
	  .source a {
		display: inline; /* ссылка остаётся в той же строке */
		margin: 0;       /* убираем возможные отступы */
	  }
	</style>
	
    <footer class="source">Source: <a href="https://vk.com/studkuratorstvo?w=wall-40766195_8333">vk.com</a></footer>
  </div>

  <script>
    /*
      Здесь задаются все карты.

      Важно:
      - для обычных Buildingов первым файлом идет 1 этаж: 1-1.jpg, 2-1.jpg и т.д.;
      - для 6 Buildings первым идет 6-map.jpg, затем уже этажи 6-1.jpg, 6-2.jpg...
      - если у тебя другое количество этажей, просто добавь или удали строки в images.
    */
    const BUILDINGS = [
      {
        id: "main",
        label: "Main map",
        images: [
          "images/main map.jpg"
        ]
      },

      {
        id: "1",
        label: "Building #1",
        images: [
          "images/1-1.jpg",
          "images/1-2.jpg"
        ]
      },

      {
        id: "2",
        label: "Building #2",
        images: [
          "images/2-1.jpg",
          "images/2-2.jpg",
          "images/2-3.jpg",
          "images/2-4.jpg"
        ]
      },

      {
        id: "3",
        label: "Building #3",
        images: [
          "images/3-1.jpg",
          "images/3-2.jpg",
          "images/3-3.jpg",
          "images/3-4.jpg"
        ]
      },

      {
        id: "4",
        label: "Building #4",
        images: [
          "images/4-1.jpg",
          "images/4-2.jpg",
          "images/4-3.jpg",
          "images/4-4.jpg",
          "images/4-5.jpg"
        ]
      },

      {
        id: "5",
        label: "Building #5",
        images: [
          "images/5-1.jpg",
          "images/5-2.jpg",
          "images/5-3.jpg",
          "images/5-4.jpg",
          "images/5-5.jpg",
          "images/5-6.jpg"
        ]
      },

      {
        id: "6",
        label: "Building #6",
        images: [
		  "images/6-map.jpg",
          "images/6-1.jpg",
          "images/6-2.jpg",
          "images/6-3.jpg",
		  "images/6-image.jpg"
        ]
      }
    ];

    const slidesEl = document.getElementById("slides");
    const navEl = document.getElementById("nav");
    const navListEl = document.getElementById("navList");
    const navToggle = document.getElementById("navToggle");
    const backdrop = document.getElementById("backdrop");
    const hint = document.getElementById("hint");

    const prevArrow = document.getElementById("prevArrow");
    const nextArrow = document.getElementById("nextArrow");

    let currentId = null;

    function toUrl(path) {
      return encodeURI(path);
    }

    function renderNav() {
      navListEl.innerHTML = "";

      BUILDINGS.forEach(building => {
        const li = document.createElement("li");
        const btn = document.createElement("button");

        btn.type = "button";
        btn.className = "nav-btn";
        btn.textContent = building.label;
        btn.dataset.id = building.id;
        btn.setAttribute("aria-current", String(building.id === currentId));

        btn.addEventListener("click", () => {
          openBuilding(building.id);
          closeNav();
        });

        li.appendChild(btn);
        navListEl.appendChild(li);
      });
    }

    function setActiveNav() {
      document.querySelectorAll(".nav-btn").forEach(btn => {
        btn.setAttribute("aria-current", String(btn.dataset.id === currentId));
      });
    }

    function updateControls() {
      const count = slidesEl.children.length;
      const canScroll = count > 1;

      const slideWidth = slidesEl.clientWidth || 1;
      const index = Math.round(slidesEl.scrollLeft / slideWidth);

      prevArrow.disabled = !canScroll || index <= 0;
      nextArrow.disabled = !canScroll || index >= count - 1;

      hint.textContent = canScroll
        ? "Swipe left/right or use arrows"
        : "This is the only image";
    }

    function slideBy(direction) {
      const slideWidth = slidesEl.clientWidth;
      if (!slideWidth) return;

      slidesEl.scrollBy({
        left: direction * slideWidth,
        behavior: "smooth"
      });

      // Небольшая страховка, чтобы стрелки сразу обновляли состояние.
      setTimeout(updateControls, 80);
    }

    function openBuilding(id) {
      const building = BUILDINGS.find(item => item.id === id) || BUILDINGS[0];
      currentId = building.id;

      slidesEl.innerHTML = "";

      building.images.forEach((src, index) => {
        const slide = document.createElement("div");
        slide.className = "slide";

        const img = document.createElement("img");
        img.alt = `${building.label}: изображение ${index + 1}`;
        img.loading = index <= 1 ? "eager" : "lazy";
        img.decoding = "async";
        img.draggable = false;
        img.src = toUrl(src);

        img.addEventListener("error", () => {
          slide.innerHTML = `<div class="fallback">Не удалось загрузить файл: ${src}</div>`;
        });

        slide.appendChild(img);
        slidesEl.appendChild(slide);
      });

      // При каждом открытии Buildings всегда начинаем с первого изображения.
      slidesEl.scrollLeft = 0;

      setActiveNav();
      updateControls();

      try {
        history.replaceState(null, "", `#${building.id}`);
      } catch (_) {
        // Некоторые браузеры/режимы могут запрещать менять hash. Это не критично.
      }
    }

    function openNav() {
      navEl.classList.add("open");
      backdrop.classList.add("show");
      navToggle.setAttribute("aria-expanded", "true");
    }

    function closeNav() {
      navEl.classList.remove("open");
      backdrop.classList.remove("show");
      navToggle.setAttribute("aria-expanded", "false");
    }

    navToggle.addEventListener("click", () => {
      if (navEl.classList.contains("open")) {
        closeNav();
      } else {
        openNav();
      }
    });

    backdrop.addEventListener("click", closeNav);

    document.addEventListener("keydown", event => {
      if (event.key === "Escape") {
        closeNav();
      }
    });

    prevArrow.addEventListener("click", () => slideBy(-1));
    nextArrow.addEventListener("click", () => slideBy(1));

    slidesEl.addEventListener("scroll", updateControls, { passive: true });
    window.addEventListener("resize", updateControls);

    /*
      Перетаскивание мышью на десктопе.
      На телефоне работает обычный свайп благодаря CSS scroll-snap.
    */
    let isDragging = false;
    let dragStartX = 0;
    let dragStartScroll = 0;

    slidesEl.addEventListener("pointerdown", event => {
      if (event.pointerType !== "mouse") return;

      isDragging = true;
      dragStartX = event.clientX;
      dragStartScroll = slidesEl.scrollLeft;

      slidesEl.classList.add("dragging");
      slidesEl.setPointerCapture(event.pointerId);
    });

    slidesEl.addEventListener("pointermove", event => {
      if (!isDragging) return;

      const dx = event.clientX - dragStartX;
      slidesEl.scrollLeft = dragStartScroll - dx;
    });

    function endDrag(event) {
      if (!isDragging) return;

      isDragging = false;
      slidesEl.classList.remove("dragging");

      try {
        slidesEl.releasePointerCapture(event.pointerId);
      } catch (_) {}

      snapToNearestSlide();
    }

    slidesEl.addEventListener("pointerup", endDrag);
    slidesEl.addEventListener("pointercancel", endDrag);

    function snapToNearestSlide() {
      const slideWidth = slidesEl.clientWidth;
      if (!slideWidth) return;

      const index = Math.round(slidesEl.scrollLeft / slideWidth);

      slidesEl.scrollTo({
        left: index * slideWidth,
        behavior: "smooth"
      });

      setTimeout(updateControls, 80);
    }

    // Листание стрелками клавиатуры.
    slidesEl.addEventListener("keydown", event => {
      if (event.key === "ArrowRight") {
        event.preventDefault();
        slideBy(1);
      }

      if (event.key === "ArrowLeft") {
        event.preventDefault();
        slideBy(-1);
      }
    });

    renderNav();

    const initialHash = decodeURIComponent(location.hash.replace("#", ""));
    const initialId = BUILDINGS.some(item => item.id === initialHash)
      ? initialHash
      : "main";

    openBuilding(initialId);

    window.addEventListener("hashchange", () => {
      const id = decodeURIComponent(location.hash.replace("#", ""));

      if (BUILDINGS.some(item => item.id === id) && id !== currentId) {
        openBuilding(id);
      }
    });
  </script>
</body>
</html>
